<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Estado de tu pedido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#15120f; --paper:#fbf3e3; --ink:#241c14; --ink-soft:#7a6a52; --line:#d9c8a3;
    --amber:#e8a33d; --teal:#2f6f66; --teal-bg:#cfe6e1; --green:#4f7a3c;
    --shadow: 0 18px 40px -20px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 20% 0%, #23180f 0%, transparent 45%),
      radial-gradient(circle at 90% 10%, #2a1a10 0%, transparent 40%),
      var(--bg-void);
    color:var(--paper); font-family:'Inter',sans-serif; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .wrap{max-width:420px;width:100%;}
  h1{
    font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:.5px;margin:0 0 16px;text-align:center;
    color:var(--amber);text-shadow:0 2px 0 rgba(0,0,0,.4);
  }
  .ticket{
    background:var(--paper);color:var(--ink);border-radius:4px;position:relative;box-shadow:var(--shadow);
    padding:26px 22px 30px;text-align:center;
  }
  .ticket::after{
    content:"";position:absolute;left:0;right:0;bottom:-9px;height:9px;
    background:linear-gradient(-45deg, var(--bg-void) 6px, transparent 0),linear-gradient(45deg, var(--bg-void) 6px, transparent 0);
    background-size:14px 14px;background-repeat:repeat-x;
  }
  .paso{display:flex;justify-content:space-between;align-items:center;margin:20px 0 22px;}
  .paso .punto{flex:1;text-align:center;position:relative;}
  .paso .circulo{
    width:34px;height:34px;border-radius:50%;background:#e6dcc3;border:2px solid var(--line);
    margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink-soft);
  }
  .paso .circulo.on{background:var(--amber);border-color:var(--amber);color:#241c14;}
  .paso .circulo.done{background:var(--green);border-color:var(--green);color:#fff;}
  .paso span{font-size:11px;color:var(--ink-soft);}
  .paso .linea{position:absolute;top:17px;left:-50%;width:100%;height:2px;background:var(--line);z-index:-1;}
  .paso:first-child .linea{display:none;}
  .estado-texto{font-family:'Bebas Neue',sans-serif;font-size:26px;margin:6px 0 4px;}
  .estado-texto.pendiente{color:#a06a10;}
  .estado-texto.en_camino{color:var(--teal);}
  .estado-texto.entregado{color:var(--green);}
  .detalle{font-size:13.5px;color:var(--ink-soft);border-top:1px dashed var(--line);margin-top:16px;padding-top:14px;text-align:left;}
  .detalle .r{display:flex;justify-content:space-between;padding:4px 0;}
  .cargando, .error{color:var(--ink-soft);font-size:14px;padding:20px 0;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Estado de tu pedido</h1>
  <div class="ticket" id="ticket">
    <div class="cargando">Buscando tu pedido...</div>
  </div>
</div>

<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const ticket = document.getElementById('ticket');

  function fmtFecha(iso){ const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y; }
  function fmtHora(hhmm){
    const [h,m]=hhmm.split(':').map(Number);
    const ap=h>=12?'pm':'am'; const h12=((h+11)%12)+1;
    return h12+':'+String(m).padStart(2,'0')+' '+ap;
  }
  function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }

  function circuloClass(paso, estado){
    const orden = ['pendiente','en_camino','entregado'];
    const actual = orden.indexOf(estado);
    const idx = orden.indexOf(paso);
    if(idx < actual) return 'circulo done';
    if(idx === actual) return 'circulo on';
    return 'circulo';
  }

  function render(p){
    const nombreEstado = { pendiente: 'Pendiente', en_camino: 'Va en camino', entregado: 'Entregado' }[p.estado] || p.estado;
    const productos = Array.isArray(p.productos) ? p.productos : [];
    ticket.innerHTML = `
      <div class="paso">
        <div class="punto"><div class="${circuloClass('pendiente', p.estado)}">1</div><span>Pedido<br>recibido</span></div>
        <div class="punto"><div class="linea"></div><div class="${circuloClass('en_camino', p.estado)}">2</div><span>En<br>camino</span></div>
        <div class="punto"><div class="linea"></div><div class="${circuloClass('entregado', p.estado)}">3</div><span>Entregado</span></div>
      </div>
      <div class="estado-texto ${p.estado}">${nombreEstado}</div>
      <div class="detalle">
        ${productos.map(li => `<div class="r"><span>${escapeHtml(li.producto)}</span><span>x${li.cantidad}</span></div>`).join('')}
        <div class="r"><span>Entrega</span><span>${fmtFecha(p.fecha)} · ${fmtHora(p.hora)}</span></div>
      </div>
    `;
  }

  async function cargar(){
    if(!id){
      ticket.innerHTML = '<div class="error">No se encontró ningún pedido para mostrar.</div>';
      return;
    }
    try{
      const res = await fetch('/api/estado?id=' + encodeURIComponent(id));
      if(!res.ok){
        ticket.innerHTML = '<div class="error">No se encontró ese pedido. Puede que ya haya pasado tiempo o el link esté incompleto.</div>';
        return;
      }
      const data = await res.json();
      render(data.pedido);
    }catch(e){
      ticket.innerHTML = '<div class="error">No se pudo consultar el estado. Intenta de nuevo en un momento.</div>';
    }
  }

  cargar();
  setInterval(cargar, 15000);
})();
</script>
</body>
</html>
