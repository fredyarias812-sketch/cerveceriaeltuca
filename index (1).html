<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Haz tu pedido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#15120f;
    --paper:#fbf3e3;
    --ink:#241c14;
    --ink-soft:#7a6a52;
    --line:#d9c8a3;
    --amber:#e8a33d;
    --amber-dark:#c17f1f;
    --rust:#b23a2e;
    --green:#4f7a3c;
    --shadow: 0 18px 40px -20px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 20% 0%, #23180f 0%, transparent 45%),
      radial-gradient(circle at 90% 10%, #2a1a10 0%, transparent 40%),
      var(--bg-void);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:0 0 60px;
  }
  .wrap{max-width:520px;margin:0 auto;padding:26px 16px 0;}
  h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:40px;letter-spacing:.5px;line-height:.95;margin:0 0 4px;
    color:var(--amber);text-shadow:0 2px 0 rgba(0,0,0,.4);
  }
  .wrap > p{margin:0 0 20px;color:#c7b79b;font-size:14px;}

  .ticket{
    background:var(--paper);color:var(--ink);border-radius:4px;
    position:relative;box-shadow:var(--shadow);padding:20px 20px 26px;
  }
  .ticket::after{
    content:"";position:absolute;left:0;right:0;bottom:-9px;height:9px;
    background:
      linear-gradient(-45deg, var(--bg-void) 6px, transparent 0),
      linear-gradient(45deg, var(--bg-void) 6px, transparent 0);
    background-size:14px 14px;background-repeat:repeat-x;
  }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field{margin-bottom:12px;}
  .field.full{grid-column:1/-1;}
  label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  input,select,textarea{
    width:100%;font-family:'Inter',sans-serif;font-size:15px;padding:10px 11px;
    border:1.5px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);
  }
  textarea{resize:vertical;min-height:44px;}
  input:focus,select:focus,textarea:focus{
    outline:none;border-color:var(--amber-dark);box-shadow:0 0 0 3px rgba(232,163,61,.25);
  }
  .line-item{display:grid;grid-template-columns:1fr 64px 30px;gap:8px;margin-bottom:8px;align-items:start;}
  .line-item input[type=number]{padding:10px 6px;text-align:center;}
  .line-remove{
    background:none;border:1.5px solid var(--line);border-radius:7px;color:var(--rust);
    font-size:15px;font-weight:700;cursor:pointer;height:41px;line-height:1;
  }
  .line-remove:disabled{opacity:.25;cursor:not-allowed;}
  .line-otro{grid-column:1/-1;margin-top:-4px;}
  .link-btn{background:none;border:none;color:var(--amber-dark);font-size:12.5px;text-decoration:underline;cursor:pointer;padding:4px 0;}
  .btn-primary{
    width:100%;margin-top:10px;background:var(--rust);color:#fff8ee;border:none;
    font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.6px;
    padding:14px;border-radius:8px;cursor:pointer;
  }
  .btn-primary:disabled{opacity:.6;}
  .error-msg{color:var(--rust);font-size:12.5px;margin-top:-6px;margin-bottom:10px;min-height:14px;}

  .success{
    background:var(--paper);color:var(--ink);border-radius:4px;position:relative;
    box-shadow:var(--shadow);padding:30px 22px;text-align:center;
  }
  .success::after{
    content:"";position:absolute;left:0;right:0;bottom:-9px;height:9px;
    background:
      linear-gradient(-45deg, var(--bg-void) 6px, transparent 0),
      linear-gradient(45deg, var(--bg-void) 6px, transparent 0);
    background-size:14px 14px;background-repeat:repeat-x;
  }
  .success h2{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--green);margin:0 0 8px;}
  .success p{font-size:14px;color:var(--ink-soft);margin:0 0 18px;}
  .resumen{text-align:left;font-size:13.5px;border-top:1px dashed var(--line);padding-top:12px;}
  .resumen .r{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line);}
  .resumen .r:last-child{border-bottom:none;}
  .otra-vez{
    margin-top:18px;background:none;border:1.5px solid var(--line);color:var(--ink);
    padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13.5px;
  }
  @media (max-width:420px){ h1{font-size:32px;} .grid2{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="wrap">
  <h1>Haz tu pedido</h1>
  <p>Llena tus datos y en un momento te lo llevamos.</p>

  <div class="ticket" id="formTicket">
    <form id="orderForm" novalidate>
      <div class="field full">
        <label for="cliente">Tu nombre</label>
        <input type="text" id="cliente" required>
      </div>

      <div class="field full">
        <label>Productos</label>
        <div id="lineItems"></div>
        <button type="button" id="addLine" class="link-btn">+ agregar otro producto</button>
      </div>

      <div class="field full">
        <label for="domicilio">Domicilio de entrega</label>
        <textarea id="domicilio" required placeholder="Calle, número, colonia, referencias..."></textarea>
      </div>

      <div class="grid2">
        <div class="field">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" required placeholder="10 dígitos">
        </div>
        <div class="field">
          <label for="fecha">Fecha de entrega</label>
          <input type="date" id="fecha" required>
        </div>
      </div>

      <div class="field full">
        <label for="hora">Hora de entrega</label>
        <input type="time" id="hora" required>
      </div>

      <div class="field full">
        <label for="notas">Notas (opcional)</label>
        <textarea id="notas" placeholder="Forma de pago, indicaciones extra..."></textarea>
      </div>

      <div class="error-msg" id="formError"></div>
      <button type="submit" class="btn-primary" id="submitBtn">Enviar pedido</button>
    </form>
  </div>

  <div class="success" id="successTicket" style="display:none;">
    <h2>¡Pedido recibido!</h2>
    <p>Gracias, en un momento te lo llevamos.</p>
    <div class="resumen" id="resumen"></div>
    <button class="otra-vez" id="otraVez">Hacer otro pedido</button>
  </div>
</div>

<script>
(function(){
  const PRODUCTOS = [
    "Ballena","Ballenón","Coronita","Modelo","Pacífico 1/4","Pacífico 1/2",
    "Corona 1/2","Mega Güera","Mega Negra","Premium Negra","Premium Güera",
    "Modelo Latón","Pacífico Amarillo","Pacífico Suave","Michelob Vidrio",
    "Clamato 1/4","Modelo Latota","Latón Corona Extra","Otro"
  ];

  const $ = (id) => document.getElementById(id);
  $('fecha').value = new Date().toISOString().slice(0,10);

  function productOptionsHtml(){
    return PRODUCTOS.map(p=>`<option value="${p}">${p}</option>`).join('');
  }
  function createLineRow(){
    const row = document.createElement('div');
    row.className = 'line-item';
    row.innerHTML = `
      <select class="line-producto">${productOptionsHtml()}</select>
      <input type="number" class="line-cantidad" min="1" value="1">
      <button type="button" class="line-remove">&times;</button>
      <input type="text" class="line-otro line-otro-input" style="display:none;" placeholder="especifica el producto">
    `;
    const sel = row.querySelector('.line-producto');
    const otro = row.querySelector('.line-otro-input');
    sel.addEventListener('change', ()=>{ otro.style.display = sel.value === 'Otro' ? 'block' : 'none'; });
    row.querySelector('.line-remove').addEventListener('click', ()=>{
      if(document.querySelectorAll('.line-item').length > 1){ row.remove(); updateRemoveButtons(); }
    });
    return row;
  }
  function updateRemoveButtons(){
    const rows = document.querySelectorAll('.line-item .line-remove');
    rows.forEach(btn => btn.disabled = rows.length === 1);
  }
  function addLineRow(){ $('lineItems').appendChild(createLineRow()); updateRemoveButtons(); }
  function resetLineItems(){ $('lineItems').innerHTML=''; addLineRow(); }
  $('addLine').addEventListener('click', addLineRow);
  resetLineItems();

  function fmtFecha(iso){ const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y; }
  function fmtHora(hhmm){
    const [h,m]=hhmm.split(':').map(Number);
    const ap = h>=12?'pm':'am'; const h12=((h+11)%12)+1;
    return h12+':'+String(m).padStart(2,'0')+' '+ap;
  }
  function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }

  $('orderForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const errEl = $('formError');
    errEl.textContent = '';

    const cliente = $('cliente').value.trim();
    const domicilio = $('domicilio').value.trim();
    const telefono = $('telefono').value.trim();
    const fecha = $('fecha').value;
    const hora = $('hora').value;
    const notas = $('notas').value.trim();

    const productos = [];
    for(const row of document.querySelectorAll('.line-item')){
      const sel = row.querySelector('.line-producto');
      const cant = parseInt(row.querySelector('.line-cantidad').value, 10);
      const otroInput = row.querySelector('.line-otro-input');
      let nombre = sel.value;
      if(nombre === 'Otro'){
        nombre = otroInput.value.trim();
        if(!nombre){ errEl.textContent = 'Especifica el nombre de cada producto marcado como "Otro".'; return; }
      }
      if(!cant || cant < 1){ errEl.textContent = 'Revisa las cantidades.'; return; }
      productos.push({ producto: nombre, cantidad: cant });
    }
    if(!cliente || !domicilio || !telefono || !fecha || !hora || productos.length === 0){
      errEl.textContent = 'Completa todos los campos.';
      return;
    }

    const submitBtn = $('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Enviando...';

    try{
      const res = await fetch('/api/pedidos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cliente, productos, domicilio, telefono, fecha, hora, notas })
      });
      if(!res.ok) throw new Error('fallo');

      $('formTicket').style.display = 'none';
      const resumen = $('resumen');
      resumen.innerHTML = `
        <div class="r"><span>Nombre</span><span>${escapeHtml(cliente)}</span></div>
        ${productos.map(p=>`<div class="r"><span>${escapeHtml(p.producto)}</span><span>x${p.cantidad}</span></div>`).join('')}
        <div class="r"><span>Entrega</span><span>${fmtFecha(fecha)} · ${fmtHora(hora)}</span></div>
      `;
      $('successTicket').style.display = 'block';
      clearTimeout(window._volverTimer);
      window._volverTimer = setTimeout(volverAlFormulario, 15000);
    }catch(err){
      errEl.textContent = 'No se pudo enviar tu pedido. Intenta de nuevo en un momento.';
    }finally{
      submitBtn.disabled = false;
      submitBtn.textContent = 'Enviar pedido';
    }
  });

  function volverAlFormulario(){
    clearTimeout(window._volverTimer);
    $('successTicket').style.display = 'none';
    $('formTicket').style.display = 'block';
    $('orderForm').reset();
    $('fecha').value = new Date().toISOString().slice(0,10);
    resetLineItems();
  }
  $('otraVez').addEventListener('click', volverAlFormulario);
})();
</script>
</body>
</html>
